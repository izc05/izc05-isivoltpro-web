services:
  isivoltpro-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isivoltpro-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
