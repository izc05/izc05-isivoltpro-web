services:
  isivoltpro-portal-staging:
    container_name: isivoltpro-portal-staging
    build:
      context: ../..
      dockerfile: Dockerfile.portal
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:?PUBLIC_SUPABASE_URL requerida}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:?PUBLIC_SUPABASE_ANON_KEY requerida}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://app-staging.isivoltpro.com}
        PUBLIC_BASE_PATH: /
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_STAGING_PORT:-18085}:8080"
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0750
      - /config:size=16m,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/portal/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
