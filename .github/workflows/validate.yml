name: Validar web

on:
  pull_request:
  push:
    branches:
      - main
      - agent/portada-ecosistema

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Construir sitio estático
        run: npm run build
