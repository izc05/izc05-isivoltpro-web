name: Promote Preinspecciones BT beta

on:
  push:
    branches:
      - feat/preinspecciones-bt-beta
    paths:
      - .github/workflows/promote-bt-beta.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/preinspecciones-bt-beta
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update catalog and homepage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const catalogPath = 'src/data/catalog.ts';
          let catalog = fs.readFileSync(catalogPath, 'utf8');
          const catalogReplacements = [
            ["status: 'Operativa' | 'Publicada' | 'Próxima publicación' | 'En desarrollo' | 'Planificado';", "status: 'Operativa' | 'Beta operativa' | 'Publicada' | 'Próxima publicación' | 'En desarrollo' | 'Planificado';"],
            ["slug: 'inspecciones-bt', code: 'BT', name: 'Inspecciones BT', family: 'Ingeniería',", "slug: 'inspecciones-bt', code: 'BT', name: 'Preinspecciones BT', family: 'Ingeniería',"],
            ["short: 'Datos, bloques, checklist, mediciones, defectos e informe.',", "short: 'Preinspección local-first, mediciones, evidencias, sincronización e informe.',"],
            ["description: 'Digitaliza inspecciones de baja tensión con datos de instalación, bloques de revisión, mediciones, defectos, fotografías y resultado final.',", "description: 'Prepara y documenta preinspecciones de baja tensión con trabajo offline, checklist, mediciones, defectos, fotografías, firmas, continuidad móvil–PC e informe profesional.',"],
            ["status: 'En desarrollo', audience: 'Inspectores, instaladores y responsables eléctricos',", "status: 'Beta operativa', audience: 'Inspectores, instaladores y responsables eléctricos',"],
            ["highlights: ['REBT y criterios técnicos', 'Mediciones y defectos', 'Evidencias fotográficas', 'Informe profesional'],", "highlights: ['REBT y criterios técnicos', 'Trabajo offline móvil y PC', 'Evidencias y cierre GPS', 'Informe profesional'],"],
            ["previewLabel: 'Flujo técnico', previewValue: 'BT', previewItems: ['Checklist', 'Mediciones', 'Informe']", "previewLabel: 'Estado actual', previewValue: 'Beta', previewItems: ['Local-first operativo', 'Sincronización validada', 'Servidor pendiente de despliegue']"]
          ];
          for (const [before, after] of catalogReplacements) {
            if (!catalog.includes(before)) throw new Error(`Catalog anchor not found: ${before}`);
            catalog = catalog.replace(before, after);
          }
          fs.writeFileSync(catalogPath, catalog);

          const homePath = 'src/pages/index.astro';
          let home = fs.readFileSync(homePath, 'utf8');
          const oldCard = "  { icon: '✓', name: 'Inspecciones BT', copy: 'Mediciones, defectos e informes.', status: 'En desarrollo', href: '/aplicaciones/inspecciones-bt' },";
          const newCard = "  { icon: '✓', name: 'Preinspecciones BT', copy: 'Campo offline, evidencias, sincronización e informe.', status: 'Beta operativa', live: true, href: '/aplicaciones/inspecciones-bt' },";
          if (!home.includes(oldCard)) throw new Error('Homepage BT card anchor not found');
          home = home.replace(oldCard, newCard);

          const liveAnchor = "              <a class=\"pv13-live-app\" href={withBase('/aplicaciones/mantenimiento-ot')}><i aria-hidden=\"true\"></i><span>IsiVoltPro OT</span><strong>Operativa</strong></a>";
          const liveBt = `${liveAnchor}\n              <a class=\"pv13-live-app\" href={withBase('/aplicaciones/inspecciones-bt')}><i aria-hidden=\"true\"></i><span>Preinspecciones BT</span><strong>Beta</strong></a>`;
          if (!home.includes(liveAnchor)) throw new Error('Homepage live apps anchor not found');
          home = home.replace(liveAnchor, liveBt);

          const oldCopy = 'Herramientas QR/NFC e IsiVoltPro OT ya están operativas. El resto del ecosistema crecerá por especialidades conectadas.';
          const newCopy = 'Herramientas QR/NFC e IsiVoltPro OT están operativas y Preinspecciones BT entra en beta local-first. El resto del ecosistema crecerá por especialidades conectadas.';
          if (!home.includes(oldCopy)) throw new Error('Homepage ecosystem copy anchor not found');
          home = home.replace(oldCopy, newCopy);
          fs.writeFileSync(homePath, home);
          NODE

      - name: Install and validate portal
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm run check

      - name: Commit promoted beta and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-bt-beta.yml
          git add src/data/catalog.ts src/pages/index.astro
          git diff --cached --check
          git commit -m "feat: present Preinspecciones BT as operational beta"
          git pull --rebase origin feat/preinspecciones-bt-beta
          git push origin HEAD:feat/preinspecciones-bt-beta
